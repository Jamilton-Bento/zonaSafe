# Central de TI — Docker Compose
# Subir:      docker compose up -d --build
# Encerrar:   docker compose down        (NÃO apaga dados; veja README antes de usar "-v")
#
# Portas publicadas (somente em 127.0.0.1, nunca na rede):
#   8081 -> front-end (WEB_PORT)         8080 -> Evolution API (EVOLUTION_PORT, diagnóstico)
# PostgreSQL, Redis e o back-end NÃO são publicados: só existem na rede interna "central-net".

name: central-ti

services:
  postgres:
    image: postgres:16-alpine
    container_name: central-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      CENTRAL_DB_PASSWORD: ${CENTRAL_DB_PASSWORD:?defina CENTRAL_DB_PASSWORD no .env}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?defina EVOLUTION_DB_PASSWORD no .env}
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks: [central-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d central -h 127.0.0.1 || pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: central-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    volumes:
      - redisdata:/data
    networks: [central-net]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7   # 2.4.x exige ativação de licença; fixamos a última estável gratuita
    container_name: central-evolution
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:${EVOLUTION_PORT:-8080}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8081}
      LOG_LEVEL: ERROR,WARN,INFO
      TZ: America/Sao_Paulo
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      # Banco (dados da sessão do WhatsApp). Guardamos o mínimo: o histórico de mensagens fica no sistema.
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: central_evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      # Cache Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Webhook: configurado POR INSTÂNCIA pelo back-end (com segredo no cabeçalho); global desativado.
      WEBHOOK_GLOBAL_ENABLED: "false"
      # Nome do dispositivo exibido no WhatsApp ("Aparelhos conectados")
      CONFIG_SESSION_PHONE_CLIENT: Central de TI
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: 6
    volumes:
      - evolution_instances:/evolution/instances
    networks: [central-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  api:
    build: ./apps/api
    image: central-ti-api:local
    container_name: central-api
    restart: unless-stopped
    # Não depende da Evolution API: o sistema funciona mesmo com o WhatsApp desconectado/indisponível.
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://central:${CENTRAL_DB_PASSWORD}@postgres:5432/central?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8081}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Dentro da rede Docker usamos o NOME DO SERVIÇO, nunca localhost.
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-central-ti}
      WEBHOOK_PUBLIC_URL: http://api:3001/api/webhooks/evolution
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET no .env}
      WA_MIN_SEND_INTERVAL_MS: ${WA_MIN_SEND_INTERVAL_MS:-5000}
      WA_MAX_SENDS_PER_DAY: ${WA_MAX_SENDS_PER_DAY:-50}
      WA_MAX_CONSECUTIVE_FAILURES: ${WA_MAX_CONSECUTIVE_FAILURES:-3}
      WA_CONNECT_COOLDOWN_MS: ${WA_CONNECT_COOLDOWN_MS:-30000}
      RETENTION_MESSAGE_DAYS: ${RETENTION_MESSAGE_DAYS:-180}
      TZ: America/Sao_Paulo
    networks: [central-net]

  web:
    build: ./apps/web
    image: central-ti-web:local
    container_name: central-web
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    networks: [central-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  central-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  evolution_instances:
